<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아이팅크 일괄 배포</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17364c;font:16px system-ui}header{background:#17364c;color:white;padding:30px}main{max-width:760px;margin:24px auto;padding:24px;background:white;border-radius:16px}label{display:block;font-weight:bold;margin:18px 0 6px}input,textarea,button{width:100%;font:inherit;padding:12px;border:1px solid #b8c7d2;border-radius:8px}button{background:#17364c;color:white;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}small{display:block;color:#526677}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#245b92}</style><header>AI THINK<h1>학생 작품 일괄 배포</h1></header><main><p>공개 가능한 작품만 등록하세요. 학생 개인정보 및 비밀 키가 포함된 파일은 제외하세요.</p><label>GitHub 인증 토큰</label><input id="token" type="password" autocomplete="off" placeholder="저장소 전용 fine-grained token"><small>이 페이지는 토큰을 저장하지 않습니다. 공개 저장소의 학생 앱과 분리하기 위해 이 HTML을 다운로드하여 로컬에서 실행하세요.</small><label>프로젝트명</label><input id="project" placeholder="학교 / 학급 / 프로젝트"><label>HTML 파일 (여러 개 선택)</label><input id="files" type="file" accept=".html,.htm" multiple><div id="filemeta"></div><label>외부 링크 (한 줄당 하나)</label><small>앱 이름 | 팀 이름 | https://주소</small><textarea id="links" rows="5" placeholder="탄소 계산기 | 1팀 | https://..."></textarea><label><input id="approve" type="checkbox" style="width:auto"> 공개 배포 및 작품 검토를 완료했습니다.</label><button id="load" type="button">기존 작품 불러오기 및 이름 수정</button><div id="existing"></div><button id="save" type="button" hidden>기존 작품 이름 저장</button><button id="go">일괄 배포</button><pre id="status" role="status"></pre><a href="https://sund1006-stack.github.io/aithink-student-apps/" target="_blank" rel="noopener noreferrer">공개 갤러리 열기</a></main><script>
const $=id=>document.getElementById(id),base='https://api.github.com/repos/sund1006-stack/aithink-student-apps',publicBase='https://sund1006-stack.github.io/aithink-student-apps/';
let fileRows=[],existingRows=[],existingSha='';function fields(parent,title,team,caption){const box=document.createElement('div'),label=document.createElement('p'),a=document.createElement('input'),b=document.createElement('input');label.textContent=caption;a.placeholder='앱 이름';a.value=title||'';b.placeholder='팀 이름';b.value=team||'';b.style.marginTop='6px';box.append(label,a,b);parent.append(box);return {a,b}}$('files').onchange=()=>{$('filemeta').replaceChildren();fileRows=[...$('files').files].map(f=>fields($('filemeta'),f.name.replace(/\.html?$/i,''),'',f.name))};$('load').onclick=async()=>{try{const t=$('token').value.trim();if(!t)throw Error('토큰을 입력하세요.');const c=await api('/contents/works.json',t);existingSha=c.sha;const data=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c.content.replace(/\s/g,'')),x=>x.charCodeAt(0))));$('existing').replaceChildren();existingRows=data.map(w=>({w,...fields($('existing'),w.title,w.team,w.project+' · '+w.url)}));$('save').hidden=false}catch(e){$('status').textContent=e.message}};$('save').onclick=async()=>{const t=$('token').value.trim();try{if(!t)throw Error('토큰을 입력하세요.');const data=existingRows.map(({w,a,b})=>({...w,title:a.value.trim()||w.title,team:b.value.trim()}));await api('/contents/works.json',t,'PUT',{message:'Update app and team names',sha:existingSha,content:b64(new TextEncoder().encode(JSON.stringify(data,null,2)))});$('status').textContent='이름 수정 완료. 갤러리 반영까지 수분 걸릴 수 있습니다.';$('save').hidden=true}catch(e){$('status').textContent=e.message}finally{$('token').value=''}};function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
async function api(path,token,method='GET',body){const r=await fetch(base+path,{method,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('GitHub '+r.status+' : '+(await r.text()).slice(0,500));return r.json()}
$('go').onclick=async()=>{const t=$('token').value.trim(),p=$('project').value.trim(),files=[...$('files').files],lines=$('links').value.trim().split(/\r?\n/).filter(x=>x.trim());if(!t||!p||!$('approve').checked||(!files.length&&!lines.length)){ $('status').textContent='토큰, 프로젝트명, 작품 및 공개 확인을 입력하세요.';return} $('go').disabled=true;try{const entries=[];for(const l of lines){const parts=l.split('|'),u=new URL(parts.pop().trim());if(u.protocol!=='https:'||u.username||u.password)throw Error('HTTPS 공개 주소만 등록 가능합니다.');entries.push({title:(parts[0]||'').trim()||u.hostname,team:(parts[1]||'').trim(),project:p,url:u.href})}for(const f of files){if(!/\.html?$/i.test(f.name)||f.size>5*1024*1024)throw Error('HTML 5MB 이하만 가능합니다: '+f.name)}$('status').textContent='저장소 확인 중';const ref=await api('/git/ref/heads/main',t),parent=await api('/git/commits/'+ref.object.sha,t),catalog=await api('/contents/works.json?ref='+ref.object.sha,t);const previous=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(catalog.content.replace(/\s/g,'')),c=>c.charCodeAt(0))));if(!Array.isArray(previous))throw Error('작품 목록 형식 오류');const tree=[];for(const f of files){const id=Date.now().toString(36)+'-'+Array.from(crypto.getRandomValues(new Uint8Array(10)),n=>n.toString(16).padStart(2,'0')).join(''),path='apps/'+id+'/index.html';$('status').textContent='파일 전송 중: '+f.name;const blob=await api('/git/blobs',t,'POST',{content:b64(new Uint8Array(await f.arrayBuffer())),encoding:'base64'});tree.push({path,mode:'100644',type:'blob',sha:blob.sha});const m=fileRows[files.indexOf(f)];entries.push({title:m?.a.value.trim()||f.name.replace(/\.html?$/i,''),team:m?.b.value.trim()||'',project:p,url:publicBase+path})}tree.push({path:'works.json',mode:'100644',type:'blob',content:JSON.stringify([...previous,...entries],null,2)});const tr=await api('/git/trees',t,'POST',{base_tree:parent.tree.sha,tree}),commit=await api('/git/commits',t,'POST',{message:'Publish '+entries.length+' student works',tree:tr.sha,parents:[ref.object.sha]});await api('/git/refs/heads/main',t,'PATCH',{sha:commit.sha,force:false});$('status').textContent='GitHub 등록 완료. Pages 반영은 수분 걸릴 수 있습니다.\n'+entries.map(x=>x.title+' : '+x.url).join('\n');$('files').value='';$('filemeta').replaceChildren();fileRows=[];$('links').value=''}catch(e){$('status').textContent='등록 실패 또는 상태 확인 필요: '+e.message}finally{$('token').value='';$('go').disabled=false}};
</script></html>
