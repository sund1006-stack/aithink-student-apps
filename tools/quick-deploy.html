<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아이팅크 일괄 배포</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17364c;font:16px system-ui}header{background:#17364c;color:white;padding:30px}main{max-width:760px;margin:24px auto;padding:24px;background:white;border-radius:16px}label{display:block;font-weight:bold;margin:18px 0 6px}input,textarea,button{width:100%;font:inherit;padding:12px;border:1px solid #b8c7d2;border-radius:8px}button{background:#17364c;color:white;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}small{display:block;color:#526677}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#245b92}</style><header>AI THINK<h1>학생 작품 일괄 배포</h1></header><main><p>공개 가능한 작품만 등록하세요. 학생 개인정보 및 비밀 키가 포함된 파일은 제외하세요.</p><label>GitHub 인증 토큰</label><p style="margin:6px 0 12px"><a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener noreferrer">인증 토큰 관리 페이지 ↗</a> · <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">새 토큰 발급 ↗</a></p><small>기존 토큰의 권한과 만료일은 확인할 수 있지만 토큰 문자열은 다시 표시되지 않습니다.</small><input id="token" type="password" autocomplete="off" placeholder="저장소 전용 fine-grained token"><small>이 페이지는 토큰을 저장하지 않습니다. 공개 저장소의 학생 앱과 분리하기 위해 이 HTML을 다운로드하여 로컬에서 실행하세요.</small><label>프로젝트명</label><input id="project" placeholder="학교 / 학급 / 프로젝트"><label>HTML 파일 (여러 개 선택)</label><input id="files" type="file" accept=".html,.htm" multiple><div id="filemeta"></div><label>외부 링크 (한 줄당 하나)</label><small>앱 이름 | 팀 이름 | https://주소</small><textarea id="links" rows="5" placeholder="탄소 계산기 | 1팀 | https://..."></textarea><label><input id="approve" type="checkbox" style="width:auto"> 공개 배포 및 작품 검토를 완료했습니다.</label><button id="load" type="button">기존 작품 불러오기 · 수정 · 삭제 · 교체</button><div id="existing"></div><button id="save" type="button" hidden>기존 작품 이름 저장</button><button id="go">일괄 배포</button><pre id="status" role="status"></pre><a href="https://sund1006-stack.github.io/aithink-student-apps/" target="_blank" rel="noopener noreferrer">공개 갤러리 열기</a></main><script>
const $=id=>document.getElementById(id),base='https://api.github.com/repos/sund1006-stack/aithink-student-apps',publicBase='https://sund1006-stack.github.io/aithink-student-apps/';
let fileRows=[],existingRows=[],existingSha='';function fields(parent,title,team,caption){const box=document.createElement('div'),label=document.createElement('p'),a=document.createElement('input'),b=document.createElement('input');label.textContent=caption;a.placeholder='앱 이름';a.value=title||'';b.placeholder='팀 이름';b.value=team||'';b.style.marginTop='6px';box.append(label,a,b);parent.append(box);return {a,b}}$('files').onchange=()=>{$('filemeta').replaceChildren();fileRows=[...$('files').files].map(f=>fields($('filemeta'),f.name.replace(/\.html?$/i,''),'',f.name))};function ownPath(w){try{const u=new URL(w.url,publicBase),baseURL=new URL(publicBase);if(u.origin!==baseURL.origin||!u.pathname.startsWith(baseURL.pathname))return null;const p=u.pathname.slice(baseURL.pathname.length);return /^apps\/[a-z0-9-]+\/index\.html$/i.test(p)?p:null}catch{return null}}
let busy=false;
async function manage(fn){if(busy||$('go').disabled)return;const t=$('token').value.trim();if(!t){$('status').textContent='토큰을 입력하세요.';return}busy=true;const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await fn(t)}catch(e){$('status').textContent=e.message}finally{busy=false;buttons.forEach(b=>b.disabled=false)}}
async function snapshot(t){const ref=await api('/git/ref/heads/main',t),parent=await api('/git/commits/'+ref.object.sha,t),c=await api('/contents/works.json?ref='+ref.object.sha,t);return {ref,parent,c,data:JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c.content.replace(/\s/g,'')),x=>x.charCodeAt(0))))}}
async function commitChanges(t,s,tree,message){const tr=await api('/git/trees',t,'POST',{base_tree:s.parent.tree.sha,tree}),commit=await api('/git/commits',t,'POST',{message,tree:tr.sha,parents:[s.ref.object.sha]});await api('/git/refs/heads/main',t,'PATCH',{sha:commit.sha,force:false})}
function catalogEntry(data){return {path:'works.json',mode:'100644',type:'blob',content:JSON.stringify(data,null,2)}}
async function checked(t){const s=await snapshot(t);if(s.c.sha!==existingSha)throw Error('작품 목록이 변경되었습니다. 다시 불러온 뒤 실행하세요.');return s}
function action(box,name,fn){const b=document.createElement('button');b.type='button';b.textContent=name;b.onclick=fn;box.append(b);return b}
async function loadWorks(t){const s=await snapshot(t);existingSha=s.c.sha;$('existing').replaceChildren();existingRows=s.data.map((w,i)=>{const box=document.createElement('section');box.style.cssText='border:1px solid #ccd7df;border-radius:12px;padding:14px;margin:12px 0';$('existing').append(box);const row={w,...fields(box,w.title,w.team,w.project+' · '+w.url)};const p=ownPath(w);if(p){const file=document.createElement('input');file.type='file';file.accept='.html,.htm';file.style.marginTop='12px';box.append(file);action(box,'HTML 파일 교체 (기존 주소 유지)',()=>manage(async t=>{const f=file.files[0];if(!f||!/\.html?$/i.test(f.name)||f.size>5*1024*1024)throw Error('5MB 이하 HTML 파일을 선택하세요.');if(!confirm('검토한 HTML로 교체하시겠습니까? 기존 주소는 유지됩니다.'))return;const s=await checked(t);const old=await api('/contents/'+p+'?ref='+s.ref.object.sha,t);await api('/contents/'+p,t,'PUT',{message:'Replace student app',sha:old.sha,content:b64(new Uint8Array(await f.arrayBuffer())),branch:'main'});$('status').textContent='파일 교체 완료. Pages 반영 후 기존 주소에서 실행됩니다.';file.value=''}))}else{const url=document.createElement('input');url.type='url';url.value=w.url;url.placeholder='새 배포 주소';url.style.marginTop='12px';box.append(url);action(box,'외부 링크 교체',()=>manage(async t=>{const u=new URL(url.value.trim());if(u.protocol!=='https:'||u.username||u.password)throw Error('공개 HTTPS 주소를 입력하세요.');const s=await checked(t);s.data[i]={...s.data[i],url:u.href};await commitChanges(t,s,[catalogEntry(s.data)],'Replace external app link');await loadWorks(t);$('status').textContent='외부 링크 교체 완료.'}))}const del=action(box,'작품 삭제',()=>manage(async t=>{if(!confirm(w.title+' 작품을 삭제하시겠습니까? '+(p?'자체 배포 파일도 삭제됩니다.':'갤러리에서만 삭제됩니다.')))return;const s=await checked(t);s.data.splice(i,1);const tree=[catalogEntry(s.data)];if(p&&!s.data.some(x=>ownPath(x)===p))tree.push({path:p,mode:'100644',type:'blob',sha:null});await commitChanges(t,s,tree,'Delete student work');await loadWorks(t);$('status').textContent='삭제 완료. Pages 반영까지 시간이 걸릴 수 있습니다.'}));del.style.background='#a52d38';return row});$('save').hidden=false}
$('load').onclick=()=>manage(loadWorks);$('save').onclick=()=>manage(async t=>{const s=await checked(t);const data=existingRows.map(({w,a,b})=>({...w,title:a.value.trim()||w.title,team:b.value.trim()}));await commitChanges(t,s,[catalogEntry(data)],'Update app and team names');await loadWorks(t);$('status').textContent='이름 수정 완료.'});
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
async function api(path,token,method='GET',body){const r=await fetch(base+path,{method,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('GitHub '+r.status+' : '+(await r.text()).slice(0,500));return r.json()}
$('go').onclick=async()=>{if(busy)return;const t=$('token').value.trim(),p=$('project').value.trim(),files=[...$('files').files],lines=$('links').value.trim().split(/\r?\n/).filter(x=>x.trim());if(!t||!p||!$('approve').checked||(!files.length&&!lines.length)){ $('status').textContent='토큰, 프로젝트명, 작품 및 공개 확인을 입력하세요.';return} $('go').disabled=true;try{const entries=[];for(const l of lines){const parts=l.split('|'),u=new URL(parts.pop().trim());if(u.protocol!=='https:'||u.username||u.password)throw Error('HTTPS 공개 주소만 등록 가능합니다.');entries.push({title:(parts[0]||'').trim()||u.hostname,team:(parts[1]||'').trim(),project:p,url:u.href})}for(const f of files){if(!/\.html?$/i.test(f.name)||f.size>5*1024*1024)throw Error('HTML 5MB 이하만 가능합니다: '+f.name)}$('status').textContent='저장소 확인 중';const ref=await api('/git/ref/heads/main',t),parent=await api('/git/commits/'+ref.object.sha,t),catalog=await api('/contents/works.json?ref='+ref.object.sha,t);const previous=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(catalog.content.replace(/\s/g,'')),c=>c.charCodeAt(0))));if(!Array.isArray(previous))throw Error('작품 목록 형식 오류');const tree=[];for(const f of files){const id=Date.now().toString(36)+'-'+Array.from(crypto.getRandomValues(new Uint8Array(10)),n=>n.toString(16).padStart(2,'0')).join(''),path='apps/'+id+'/index.html';$('status').textContent='파일 전송 중: '+f.name;const blob=await api('/git/blobs',t,'POST',{content:b64(new Uint8Array(await f.arrayBuffer())),encoding:'base64'});tree.push({path,mode:'100644',type:'blob',sha:blob.sha});const m=fileRows[files.indexOf(f)];entries.push({title:m?.a.value.trim()||f.name.replace(/\.html?$/i,''),team:m?.b.value.trim()||'',project:p,url:publicBase+path})}tree.push({path:'works.json',mode:'100644',type:'blob',content:JSON.stringify([...previous,...entries],null,2)});const tr=await api('/git/trees',t,'POST',{base_tree:parent.tree.sha,tree}),commit=await api('/git/commits',t,'POST',{message:'Publish '+entries.length+' student works',tree:tr.sha,parents:[ref.object.sha]});await api('/git/refs/heads/main',t,'PATCH',{sha:commit.sha,force:false});$('status').textContent='GitHub 등록 완료. Pages 반영은 수분 걸릴 수 있습니다.\n'+entries.map(x=>x.title+' : '+x.url).join('\n');$('files').value='';$('filemeta').replaceChildren();fileRows=[];$('links').value=''}catch(e){$('status').textContent='등록 실패 또는 상태 확인 필요: '+e.message}finally{$('token').value='';$('go').disabled=false}};
</script></html>
