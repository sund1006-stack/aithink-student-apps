<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>웹앱 갤러리</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#17364c;font:16px system-ui,sans-serif}header{background:#17364c;color:white;padding:48px 6%}header small{letter-spacing:3px}main{max-width:1100px;margin:auto;padding:28px}input,select,button,a.btn{font:inherit;padding:12px;border:1px solid #ccd7df;border-radius:9px;background:white;color:inherit}a.btn{display:inline-block;text-decoration:none;background:#17364c;color:white}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}article{background:white;border:1px solid #dce4ea;border-radius:16px;padding:22px}article p{overflow-wrap:anywhere}footer{padding:30px;text-align:center;color:#657789}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}h1{font-size:clamp(28px,5vw,44px)}button{cursor:pointer}</style><header><small>AI THINK · PROJECT GALLERY</small><h1>웹앱 갤러리</h1><p>우리가 만든 아이디어를 직접 실행해 보세요.</p></header><main><div class="tools"><select id="project"><option value="">전체 프로젝트</option></select><input id="q" placeholder="작품 검색" aria-label="작품 검색"><button id="share">갤러리 주소 복사</button></div><p id="status" role="status">작품을 불러오는 중입니다.</p><section id="grid"></section></main><footer>AI THINK | 아이팅크 SW·AI 교육</footer><script>const $=id=>document.getElementById(id);let works=[];function render(){const p=$('project').value,q=$('q').value.toLowerCase();const rows=works.filter(w=>(!p||w.project===p)&&(String(w.title)+' '+(w.team||'')).toLowerCase().includes(q));$('grid').replaceChildren();$('status').textContent=rows.length?rows.length+'개 작품':'등록된 작품이 없습니다.';for(const w of rows){let u;try{u=new URL(w.url,location.href);if(u.protocol!=='https:')continue}catch{continue}const a=document.createElement('article'),h=document.createElement('h2'),s=document.createElement('p'),b=document.createElement('a'),c=document.createElement('button');h.textContent=w.title;s.textContent=w.project||'웹앱 프로젝트';b.textContent='작품 실행 ↗';b.href=u.href;b.target='_blank';b.rel='noopener noreferrer';b.className='btn';c.textContent='주소 복사';c.style.marginLeft='8px';c.onclick=()=>navigator.clipboard.writeText(u.href).then(()=>c.textContent='복사 완료').catch(()=>prompt('주소 복사',u.href));const team=document.createElement('p');team.textContent='팀: '+(w.team||'미등록');a.append(s,h,team,b,c);$('grid').append(a)}}$('project').onchange=render;$('q').oninput=render;$('share').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>$('share').textContent='복사 완료').catch(()=>prompt('주소 복사',location.href));fetch('works.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{works=Array.isArray(d)?d:[];for(const p of new Set(works.map(w=>w.project).filter(Boolean))){const o=document.createElement('option');o.value=p;o.textContent=p;$('project').append(o)}const p=new URLSearchParams(location.search).get('project');if(p)$('project').value=p;render()}).catch(()=>$('status').textContent='작품 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.');</script></html>
